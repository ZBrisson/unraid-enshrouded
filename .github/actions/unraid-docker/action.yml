name: Unraid's Docker
description: >
  Run the job's containers on the Docker Engine version Unraid ships, not the runner's.
  The tests claim "works on Unraid"; the engine (and its default seccomp profile) is part of
  that environment. Bump the version input's default with the README's "Tested on" table when Unraid's
  Docker changes (on the server: docker version --format '{{.Server.Version}}').
inputs:
  version:
    description: Unraid's Docker Engine version (29.8.2 on Unraid 7.3.4, read with docker version on the host 2026-11-24)
    default: "29.8.2"
runs:
  using: composite
  steps:
    - uses: docker/setup-docker-action@3f1ab1ab0e29231562e4db4ca600c1a49653bac6 # v5.7.0
      with:
        version: v${{ inputs.version }}
        set-host: true
    - name: Engine matches Unraid
      shell: bash
      env:
        WANT: ${{ inputs.version }}
      run: |
        got=$(docker version --format '{{.Server.Version}}')
        echo "Docker Engine: $got (Unraid: $WANT)" | tee -a "$GITHUB_STEP_SUMMARY"
        if [[ $got != "$WANT" ]]; then
          echo "::error::tests would run on Docker $got, not Unraid's $WANT"
          exit 1
        fi
