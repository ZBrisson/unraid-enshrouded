name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1" # weekly: catch upstream image and Steam changes
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pytest pyflakes
      - run: sudo apt-get install -y --no-install-recommends libxml2-utils
      - name: XML is well-formed
        run: xmllint --noout my-enshrouded.xml
      - name: Unraid template rules
        run: python tools/template.py validate my-enshrouded.xml
      - run: python -m pyflakes tools/ tests/
      - run: python -m pytest -q tests/
      - run: shellcheck tests/*.sh
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:latest -color

  branches:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.b.outputs.images }}
    steps:
      - uses: actions/checkout@v4
      - id: b
        run: echo "images=$(python3 tools/template.py branches my-enshrouded.xml)" >> "$GITHUB_OUTPUT"

  image:
    # Every image the template offers must pull, and every variable the template sets must be
    # read somewhere in that image's scripts (catches upstream renames).
    needs: branches
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.branches.outputs.images) }}
    name: image (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4
      - name: Pull
        run: |
          docker pull "${{ matrix.image }}"
          docker image inspect -f 'built {{.Created}}' "${{ matrix.image }}"
      - name: Template variables exist in the image
        run: |
          id=$(docker create "${{ matrix.image }}")
          docker cp "$id:/usr/local/etc/enshrouded" scripts
          docker rm "$id"
          python3 tools/template.py envcheck my-enshrouded.xml scripts

  upstream-release:
    # Goes red when upstream releases something newer than KNOWN_RELEASE: run smoke against the
    # stable-* tags, update the README's Verified table, then bump KNOWN_RELEASE.
    runs-on: ubuntu-latest
    env:
      KNOWN_RELEASE: "1.8.1"
    steps:
      - run: |
          latest=$(curl -fsS "https://hub.docker.com/v2/repositories/mornedhels/enshrouded-server/tags?page_size=100" \
            | jq -r '.results[].name | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))' | sort -V | tail -1)
          echo "latest upstream release: $latest (known: $KNOWN_RELEASE)" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$(printf '%s\n%s\n' "$KNOWN_RELEASE" "$latest" | sort -V | tail -1)" != "$KNOWN_RELEASE" ]; then
            echo "::error::upstream released $latest; test its stable tags and move the template off the dev pin"
            exit 1
          fi

  steam:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: GAME_BRANCH exists on Steam
        run: |
          build=$(tests/steam_buildid.sh)
          echo "Steam build: $build" >> "$GITHUB_STEP_SUMMARY"

  template-urls:
    # The URLs Unraid fetches must resolve once the template is on main.
    if: github.event_name != 'pull_request'
    needs: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          for key in TemplateURL Icon; do
            url=$(python3 tools/template.py get my-enshrouded.xml "$key")
            curl -fsSIL --retry 3 "$url" >/dev/null && echo "$key ok: $url"
          done
