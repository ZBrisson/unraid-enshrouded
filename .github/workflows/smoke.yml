name: smoke
# Boots the real server from the template (~30-45 min: downloads the game, starts it twice).
on:
  workflow_dispatch:
    inputs:
      only:
        description: Run only this variant (e.g. dev-proton); empty runs every <Branch> in the template
        required: false
        default: ""
  schedule:
    - cron: "41 7 * * 1" # weekly, after ci
  pull_request:
    paths:
      - my-enshrouded.xml
      - tools/**
      - tests/smoke.sh
      - tests/check_config.py
      - tests/steam_buildid.sh
      - .github/workflows/smoke.yml
permissions:
  contents: read
concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  steam:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.build.outputs.build }}
      images: ${{ steps.b.outputs.images }}
    steps:
      - uses: actions/checkout@v4
      - id: build
        run: echo "build=$(tests/steam_buildid.sh)" >> "$GITHUB_OUTPUT"
      - id: b
        env:
          ONLY: ${{ inputs.only }}
        run: |
          images=$(python3 tools/template.py branches my-enshrouded.xml \
            | jq -c --arg only "$ONLY" 'map(select($only == "" or .name == $only))')
          echo "images=$images" >> "$GITHUB_OUTPUT"

  smoke:
    needs: steam
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.steam.outputs.images) }}
    name: smoke (${{ matrix.name }})
    steps:
      - name: Free disk space for the game install
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v4
      - name: Smoke test
        env:
          IMAGE: ${{ matrix.image }}
          EXPECTED_BUILD: ${{ needs.steam.outputs.build }}
          WORK: ${{ runner.temp }}/smoke
        run: tests/smoke.sh
      - name: Collect logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-${{ matrix.name }}
          path: ${{ runner.temp }}/smoke/logs
          if-no-files-found: ignore
